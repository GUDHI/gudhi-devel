jobs:
  - job: "Windows"
    displayName: "Build and test Windows"
    timeoutInMinutes: 0
    cancelTimeoutInMinutes: 60
    pool:
      vmImage: windows-2025
    variables:
      pythonVersion: "3.11"
      cmakeBuildType: Release
      cmakeVcpkgFlags: -DVCPKG_TARGET_TRIPLET=x64-windows-release -DCMAKE_TOOLCHAIN_FILE=c:\vcpkg\scripts\buildsystems\vcpkg.cmake
      gudhiCmakeOptions: -DWITH_GUDHI_EXAMPLE=ON -DWITH_GUDHI_REMOTE_TEST=ON -DFORCE_EIGEN_DEFAULT_DENSE_INDEX_TYPE_TO_INT=ON
      # On this VM, 2 versions of python are installed. Default Python_FIND_REGISTRY is FIRST, which means asks registry first
      # LAST means consult registry in last resort, use the standard libraries or headers first
      extraCmakeOptions: -DPython_FIND_REGISTRY=LAST
      # To cache scikit_learn_data - no need to always download it and fails sometimes
      SCIKIT_LEARN_DATA: $(Agent.BuildDirectory)/scikit_learn_data

    steps:
      - task: Cache@2
        inputs:
          key: 'scikit-learn-data | "$(Agent.OS)"'
          restoreKeys: |
            scikit-learn-data | "$(Agent.OS)"
          path: |
            $(Agent.BuildDirectory)/scikit_learn_data
        displayName: "Cache scikit-learn data"
      - checkout: self
        submodules: true
      # Use a specific Python version
      - task: UsePythonVersion@0
        displayName: Use Python $(pythonVersion)
        inputs:
          versionSpec: $(pythonVersion)
          addToPath: true
          architecture: "x64"
      - pwsh: |
          $ErrorActionPreference = "stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python --version
          python -m pip install -r ext/gudhi-deploy/build-requirements.txt
          python -m pip install -r ext/gudhi-deploy/test-requirements.txt
          choco install -y ninja --force --force-dependencies
          vcpkg install boost-filesystem boost-test boost-program-options tbb eigen3 cgal --triplet x64-windows-release
        displayName: "Install build dependencies"
      - pwsh: |
          $ErrorActionPreference = "stop"
          $PSNativeCommandUseErrorActionPreference = $true
          mkdir build
          cd build
          python --version
          cmake -DCMAKE_BUILD_TYPE:STRING=$(cmakeBuildType) -GNinja $(cmakeVcpkgFlags) $(gudhiCmakeOptions) $(extraCmakeOptions) --log-level=DEBUG ..
          ninja
          ctest --output-on-failure -C Release -E diff_files
        displayName: "Build and test"
