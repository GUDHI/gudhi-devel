          $PYTHON313/bin/python -m pytest src/python/test/test_dtm_rips_complex.py
          $PYTHON313/bin/python -m pytest src/python/test/test_euclidean_witness_complex.py
          $PYTHON313/bin/python -m pytest src/python/test/test_off.py
          $PYTHON313/bin/python -m pytest src/python/test/test_persistence_graphical_tools.py
          $PYTHON313/bin/python -m pytest src/python/test/test_reader_utils.py
          $PYTHON313/bin/python -m pytest src/python/test/test_remote_datasets.py
          $PYTHON313/bin/python -m pytest src/python/test/test_representations_interface.py
          $PYTHON313/bin/python -m pytest src/python/test/test_representations_preprocessing.py
          $PYTHON313/bin/python -m pytest src/python/test/test_representations.py
          $PYTHON313/bin/python -m pytest src/python/test/test_rips_complex.py
          $PYTHON313/bin/python -m pytest src/python/test/test_simplex_generators.py
