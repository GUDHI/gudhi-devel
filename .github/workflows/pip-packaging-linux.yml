          $PYTHON312/bin/python -m pytest src/python/test/test_euclidean_witness_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_off.py
          $PYTHON312/bin/python -m pytest src/python/test/test_persistence_graphical_tools.py
          $PYTHON312/bin/python -m pytest src/python/test/test_reader_utils.py
          $PYTHON312/bin/python -m pytest src/python/test/test_remote_datasets.py
          $PYTHON312/bin/python -m pytest src/python/test/test_representations_interface.py
          $PYTHON312/bin/python -m pytest src/python/test/test_representations_preprocessing.py
          $PYTHON312/bin/python -m pytest src/python/test/test_representations.py
          $PYTHON312/bin/python -m pytest src/python/test/test_rips_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_simplex_generators.py
          $PYTHON312/bin/python -m pytest src/python/test/test_simplex_tree.py
          $PYTHON312/bin/python -m pytest src/python/test/test_simplex_tree_serialization.py
          $PYTHON312/bin/python -m pytest src/python/test/test_sklearn_cubical_persistence.py
          $PYTHON312/bin/python -m pytest src/python/test/test_sklearn_rips_persistence.py
          $PYTHON312/bin/python -m pytest src/python/test/test_subsampling.py
          $PYTHON312/bin/python -m pytest src/python/test/test_tangential_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_time_delay.py
          $PYTHON312/bin/python -m pytest src/python/test/test_tomato.py
          $PYTHON312/bin/python -m pytest src/python/test/test_wasserstein_barycenter.py
          $PYTHON312/bin/python -m pytest src/python/test/test_weighted_rips_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_witness_complex.py
      - name: Build wheel for Python 3.13
