name: pip packaging linux

on:
  release:
    types: [published]

jobs:
  build:
    name: build pip wheel
    runs-on: ubuntu-latest
    # cf. https://github.com/GUDHI/gudhi-deploy/blob/main/Dockerfile_for_pip
    container: ghcr.io/gudhi/gudhi-deploy/pip_for_gudhi:2026.09.03
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Build wheel for Python 3.11
        env:
          SKBUILD_CMAKE_DEFINE: "Python_EXECUTABLE=$PYTHON311/bin/python"
        run: |
          $PYTHON311/bin/python -m pip wheel -ve .
      - name: Install and test wheel for Python 3.11
        run: |
          $PYTHON311/bin/python -m pip install numpy~=1.23.2
          $PYTHON311/bin/python -m pip install --user pytest scipy matplotlib scikit-learn POT *cp311-linux_x86_64.whl
          $PYTHON311/bin/python -c "import gudhi; print(gudhi.__version__)"
          cp data/points/human.off .
          $PYTHON311/bin/python -m pytest src/python/test/test_alpha_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_betti_curve_representations.py
          $PYTHON311/bin/python -m pytest src/python/test/test_bottleneck_distance.py
          $PYTHON311/bin/python -m pytest src/python/test/test_collapse_edges.py
          $PYTHON311/bin/python -m pytest src/python/test/test_cover_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_cubical_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_cubical_persistence_low_dim.py
          $PYTHON311/bin/python -m pytest src/python/test/test_datasets_generators.py
          $PYTHON311/bin/python -m pytest src/python/test/test_delaunay_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_dtm_rips_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_euclidean_witness_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_off.py
          $PYTHON311/bin/python -m pytest src/python/test/test_persistence_graphical_tools.py
          $PYTHON311/bin/python -m pytest src/python/test/test_reader_utils.py
          $PYTHON311/bin/python -m pytest src/python/test/test_remote_datasets.py
          $PYTHON311/bin/python -m pytest src/python/test/test_representations_interface.py
          $PYTHON311/bin/python -m pytest src/python/test/test_representations_preprocessing.py
          $PYTHON311/bin/python -m pytest src/python/test/test_representations.py
          $PYTHON311/bin/python -m pytest src/python/test/test_rips_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_simplex_generators.py
          $PYTHON311/bin/python -m pytest src/python/test/test_simplex_tree.py
          $PYTHON311/bin/python -m pytest src/python/test/test_simplex_tree_serialization.py
          $PYTHON311/bin/python -m pytest src/python/test/test_sklearn_cubical_persistence.py
          $PYTHON311/bin/python -m pytest src/python/test/test_sklearn_rips_persistence.py
          $PYTHON311/bin/python -m pytest src/python/test/test_subsampling.py
          $PYTHON311/bin/python -m pytest src/python/test/test_tangential_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_time_delay.py
          $PYTHON311/bin/python -m pytest src/python/test/test_tomato.py
          $PYTHON311/bin/python -m pytest src/python/test/test_wasserstein_barycenter.py
          $PYTHON311/bin/python -m pytest src/python/test/test_weighted_rips_complex.py
          $PYTHON311/bin/python -m pytest src/python/test/test_witness_complex.py
      - name: Build wheel for Python 3.12
        env:
          SKBUILD_CMAKE_DEFINE: "Python_EXECUTABLE=$PYTHON312/bin/python"
        run: |
          $PYTHON312/bin/python -m pip wheel -ve .
      - name: Install and test wheel for Python 3.12
