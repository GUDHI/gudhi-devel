          $PYTHON313/bin/python -m pytest src/python/test/test_bottleneck_distance.py
          $PYTHON313/bin/python -m pytest src/python/test/test_collapse_edges.py
          $PYTHON313/bin/python -m pytest src/python/test/test_cover_complex.py
          $PYTHON313/bin/python -m pytest src/python/test/test_cubical_complex.py
          $PYTHON313/bin/python -m pytest src/python/test/test_cubical_persistence_low_dim.py
          $PYTHON313/bin/python -m pytest src/python/test/test_datasets_generators.py
