          cp data/points/human.off .
          $PYTHON312/bin/python -m pytest src/python/test/test_alpha_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_betti_curve_representations.py
          $PYTHON312/bin/python -m pytest src/python/test/test_bottleneck_distance.py
          $PYTHON312/bin/python -m pytest src/python/test/test_collapse_edges.py
          $PYTHON312/bin/python -m pytest src/python/test/test_cover_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_cubical_complex.py
          $PYTHON312/bin/python -m pytest src/python/test/test_cubical_persistence_low_dim.py
          $PYTHON312/bin/python -m pytest src/python/test/test_datasets_generators.py
